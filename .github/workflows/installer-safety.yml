name: Installer safety

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'scripts/install-skills.*'
      - 'scripts/install-claude-skills.sh'
      - 'scripts/build-portable-skills.py'
      - 'skills/**'
      - 'tests/test_portable_skills.py'
      - 'scripts/validate-skill-architecture.sh'
      - 'scripts/validate-agent-distribution.sh'
      - 'tests/test_install_*.py'
      - 'frameworks/**'
      - 'playbooks/**'
      - 'templates/**'
      - 'workflows/**'
      - '*.md'
      - '.github/workflows/installer-safety.yml'

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer regression tests
        run: python3 -m unittest discover -s tests -p 'test_install_*.py' -v
      - name: Cross-agent distribution validator
        run: bash scripts/validate-agent-distribution.sh .
      - name: Full repository install and repeat install
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/marketing-os-smoke-home/.codex"
          mkdir -p "$runtime/skills/unrelated" "$runtime/frameworks"
          printf 'Personal instructions\n' > "$runtime/AGENTS.md"
          printf 'Personal Claude instructions\n' > "$runtime/CLAUDE.md"
          printf 'Personal framework\n' > "$runtime/frameworks/personal.md"
          printf '[Unrelated](../missing.md)\n' > "$runtime/skills/unrelated/SKILL.md"
          cp "$runtime/AGENTS.md" "$RUNNER_TEMP/personal-agents-before.md"
          cp "$runtime/CLAUDE.md" "$RUNNER_TEMP/personal-claude-before.md"
          bash scripts/install-skills.sh . "$runtime" --dry-run
          bash scripts/install-skills.sh . "$runtime"
          bash scripts/install-skills.sh . "$runtime"
          cmp "$runtime/AGENTS.md" "$RUNNER_TEMP/personal-agents-before.md"
          cmp "$runtime/CLAUDE.md" "$RUNNER_TEMP/personal-claude-before.md"
          grep -Fxq 'Personal framework' "$runtime/frameworks/personal.md"
          grep -Fxq '[Unrelated](../missing.md)' "$runtime/skills/unrelated/SKILL.md"
          test ! -e "$runtime/.marketing-os-backups"
          HOME="$(dirname "$runtime")" bash scripts/validate-skill-architecture.sh . | tee "$RUNNER_TEMP/installed-integrity.txt"
          if grep -Eq 'drifted|not installed in the local runtime|Required installed contracts are missing|Unresolved links in the installed runtime' "$RUNNER_TEMP/installed-integrity.txt"; then
            printf 'Installed-runtime integrity reported an unexpected warning.\n' >&2
            exit 1
          fi
          python3 - "$runtime" <<'PY'
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          manifest = json.loads((root / '.marketing-os/manifest.json').read_text())
          expected = sorted(p.parent.name for p in Path('.agents/skills').glob('*/SKILL.md'))
          assert manifest['skills'] == expected, (manifest['skills'], expected)
          print(f'Full repository install verified: {len(expected)} skills.')
          PY
      - name: Claude wrapper in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/marketing-os-claude-home"
          mkdir -p "$isolated_home/.claude"
          printf 'Personal Claude instructions\n' > "$isolated_home/.claude/CLAUDE.md"
          HOME="$isolated_home" bash scripts/install-claude-skills.sh .
          grep -Fxq 'Personal Claude instructions' "$isolated_home/.claude/CLAUDE.md"
          test -f "$isolated_home/.claude/skills/marketing-router/SKILL.md"

  agent-skills-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable distribution is current
        run: python3 scripts/build-portable-skills.py --check
      - name: List skills through public Agent Skills CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list | tee "$RUNNER_TEMP/skills-list.txt"
          grep -q 'marketing-router' "$RUNNER_TEMP/skills-list.txt"
          grep -q 'google-ads' "$RUNNER_TEMP/skills-list.txt"
          grep -q 'marketing-analytics' "$RUNNER_TEMP/skills-list.txt"
      - name: Install selected portable skills into Codex
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/skills-cli-codex-home"
          mkdir -p "$isolated_home"
          HOME="$isolated_home" npx --yes skills@latest add "$GITHUB_WORKSPACE" \
            --skill marketing-router \
            --skill google-ads \
            -g \
            -a codex \
            --copy \
            -y
          test -f "$isolated_home/.codex/skills/marketing-router/SKILL.md"
          test -f "$isolated_home/.codex/skills/marketing-router/_shared/AGENTS.md"
          test -f "$isolated_home/.codex/skills/google-ads/SKILL.md"
          test -f "$isolated_home/.codex/skills/google-ads/_shared/AGENTS.md"
      - name: Install all portable skills into Claude Code
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/skills-cli-claude-home"
          mkdir -p "$isolated_home"
          HOME="$isolated_home" npx --yes skills@latest add "$GITHUB_WORKSPACE" \
            --skill '*' \
            -g \
            -a claude-code \
            --copy \
            -y
          canonical_count=$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md -type f | wc -l | tr -d ' ')
          installed_count=$(find "$isolated_home/.claude/skills" -mindepth 2 -maxdepth 2 -name SKILL.md -type f | wc -l | tr -d ' ')
          test "$installed_count" -eq "$canonical_count"
          test -f "$isolated_home/.claude/skills/marketing-router/_shared/AGENTS.md"
          printf 'Agent Skills CLI installed %s portable skills.\n' "$installed_count"
