name: Regenerate GPT pack temporary

on:
  push:
    branches:
      - feature/complete-system-gaps

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build generated pack
        run: python3 scripts/build-gpt-knowledge.py
      - name: Upload generated pack
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-gpt-pack
          path: gpt-knowledge/pack
          if-no-files-found: error
