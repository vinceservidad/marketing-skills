name: Regenerate GPT pack temporary

on:
  push:
    branches:
      - feature/complete-system-gaps

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-system-gaps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build generated pack
        run: python3 scripts/build-gpt-knowledge.py
      - name: Commit generated pack
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gpt-knowledge/pack; then
            echo "GPT pack already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpt-knowledge/pack
          git commit -m "[skip ci] Regenerate GPT knowledge pack"
          git push origin HEAD:feature/complete-system-gaps
