name: Regenerate portable skills temporary

on:
  push:
    branches:
      - feature/v2-portable-skills

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-portable-skills
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable skills
        run: python3 scripts/build-portable-skills.py
      - name: Run portable distribution tests
        run: python3 -m unittest tests.test_portable_skills -v
      - name: Commit generated portable skills
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- skills; then
            echo "Portable skills already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          git commit -m "[skip ci] Generate portable Agent Skills"
          git push origin HEAD:feature/v2-portable-skills
