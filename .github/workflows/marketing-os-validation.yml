name: Marketing OS validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "*.md"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "ARTIFACT-OWNERSHIP.md"
      - "CAPABILITY-REGISTRY.md"
      - "CHANGELOG.md"
      - "GLOSSARY.md"
      - "KNOWLEDGE-TAXONOMY.md"
      - "PLATFORM-CURRENCY.md"
      - "README.md"
      - "ROADMAP.md"
      - ".agents/skills/**"
      - "agents/**"
      - "evaluations/**"
      - "examples/**"
      - "gpt-knowledge/**"
      - "integrations/**"
      - "validation/**"
      - "docs/**"
      - "skills/**"
      - "workflows/**"
      - "frameworks/**"
      - "playbooks/**"
      - "templates/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill architecture
        run: scripts/validate-skill-architecture.sh .
      - name: Validate terminology
        run: scripts/validate-terminology.sh .
      - name: Validate platform currency
        run: scripts/validate-platform-currency.sh .
      - name: Validate knowledge taxonomy
        run: scripts/validate-knowledge-taxonomy.sh .
      - name: Validate optimization and scaling
        run: scripts/validate-scaling-system.sh .
      - name: Check platform freshness
        run: python3 scripts/check-platform-freshness.py .
      - name: Validate system boundaries
        run: python3 scripts/validate-system-boundaries.py
      - name: Validate evaluation corpus and routing references
        run: python3 scripts/eval.py --static
      - name: GPT export matches current canonical content
        run: python3 scripts/build-gpt-knowledge.py --check
      - name: Offline tooling regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check relative Markdown file links
        run: python3 scripts/check-markdown-links.py
